name: Latest Blog Posts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://nineliveszerotrust.com/index.xml"
          max_post_count: "5"
          # Keep each article readable and preserve spacing around the README markers.
          template: "$newline**[$title]($url)**<br>$newline<sub>$date</sub>$newline$newline$description$newline"
          date_format: "UTC:mmm d, yyyy"
          item_exec: |
            post.description = post.description.replace(/\s+/g, ' ').trim();
            if (post.description.length > 150) {
              post.description = post.description.slice(0, 150).replace(/\s+\S*$/, '').replace(/[.,;:!?]+$/, '') + '…';
            }
          commit_message: "Update latest blog posts"
